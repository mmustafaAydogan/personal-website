---
layout: default
---
<article class="profile">
  <header class="page-head">
    <h1 class="page-heading" data-tr="{{ page.title_tr | default: page.title }}">{{ page.title }}</h1>
  </header>

  <div class="profile-body">
    {{ content }}
  </div>

  {%- if site.github_username %}
  <section class="section contrib" data-gh-contrib="{{ site.github_username }}">
    <div class="contrib-layout">
      <div class="contrib-box">
        <div class="contrib-graph" data-gh="contrib-graph">
          <p class="contrib-status is-loading" data-tr="Katkı grafiği yükleniyor…">Loading contribution graph…</p>
        </div>
        <div class="contrib-foot">
          <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" data-tr="GitHub profilimde gör →">View on my GitHub profile &rarr;</a>
          <span class="contrib-legend" aria-hidden="true">
            <span data-tr="Az">Less</span> <i class="lv0"></i><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><i class="lv4"></i> <span data-tr="Çok">More</span>
          </span>
        </div>
      </div>
      <ul class="contrib-years" data-gh="contrib-years" aria-label="Select year"></ul>
    </div>
  </section>
  <script defer src="{{ '/assets/js/gh-contrib.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script defer src="{{ '/assets/js/brand-slider.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {%- endif %}
</article>
